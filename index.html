
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>محفظة Flash USDT</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <h2>محفظة Flash USDT</h2>
    <div id="auth">
      <input id="username" placeholder="الاسم الكامل">
      <input id="email" placeholder="البريد الإلكتروني">
      <input id="password" placeholder="كلمة المرور" type="password">
      <button onclick="register()">تسجيل</button>
    </div>
    <div id="wallet" style="display:none;">
      <p>مرحبًا <span id="user-name"></span></p>
      <p>العنوان: <span id="user-address">TFakeWalletAddress123</span></p>
      <p>الرصيد المؤقت: <span id="balance">5000</span> USDT</p>
      <p>الصلاحية: <span id="expiry"></span></p>
      <input id="recipient" placeholder="عنوان TRC-20">
      <input id="amount" placeholder="المبلغ">
      <button onclick="send()">إرسال</button>
      <h3>سجل التحويلات</h3>
      <ul id="history"></ul>
    </div>
  </div>
  <script src="assets/script.js"></script>
</body>
</html>
